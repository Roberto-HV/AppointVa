name: Mantener backend despierto

# El Web Service del backend está en el plan Free de Render, que duerme el
# servicio tras 15 minutos sin tráfico. Despertarlo toma ~37 s, y quien lo paga
# es la clienta que abre el enlace de reservas. Este ping lo mantiene arriba.
#
# Se pega a /health a propósito: además de la app, valida la base de datos, así
# que también deja caliente el pool de conexiones.
#
# Ojo con dos límites de GitHub Actions:
#   - El cron puede retrasarse bastante bajo carga. Si se pasa de 15 minutos el
#     servicio duerme y el siguiente ping lo despierta, así que algún usuario
#     todavía puede toparse con el arranque frío.
#   - Los workflows programados se desactivan solos tras 60 días sin actividad
#     en el repo.
# Un monitor externo (UptimeRobot, cron-job.org) es más puntual si esto no basta.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          url="https://appointva.onrender.com/health"
          for intento in 1 2 3; do
            if code=$(curl -fsS --max-time 120 -o /dev/null -w '%{http_code} en %{time_total}s' "$url"); then
              echo "OK en el intento $intento — $code"
              exit 0
            fi
            echo "intento $intento falló"
            sleep 15
          done
          echo "::error::El backend no respondió tras 3 intentos"
          exit 1
